fragment Checkout on Checkout {
	id
	email
	lines {
		id
		quantity
		totalPrice {
			gross {
				amount
				currency
			}
		}
		variant {
			product {
				id
				name
				slug
				thumbnail {
					url
					alt
				}
				category {
					name
				}
			}
			pricing {
				price {
					gross {
						amount
						currency
					}
				}
			}
			name
			id
			attributes {
				attribute {
					name
					slug
					inputType
				}
				values {
					name
					slug
					value
				}
			}
		}
	}
	totalPrice {
		gross {
			amount
			currency
		}
	}
}

query CheckoutFind($id: ID!) {
	checkout(id: $id) {
		...Checkout
	}
}
