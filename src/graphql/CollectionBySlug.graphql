query CollectionBySlug($slug: String!, $channel: String!) {
  collection(slug: $slug, channel: $channel) {
    ...CollectionDetailsFragment
  }
}

fragment CollectionDetailsFragment on Collection {
  id
    name
   metadata {
    key
    value
     }
  seoTitle
  seoDescription
  description
  backgroundImage {
    url 
    alt
  }
}
