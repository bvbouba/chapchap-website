fragment OrderDetails on Order {
	id
	number
	created
	status
	isPaid
	customerNote
	paymentStatus
	paymentStatusDisplay
	authorizeStatus
	chargeStatus
	metadata {
		key
		value
	}
	fulfillments {
		id
		status
	}
	billingAddress {
		phone
	}
	total {
		gross {
			amount
			currency
		}
	}
	lines {
		id
		quantity
		totalPrice {
			gross {
				amount
				currency
			}
		}
		unitPrice {
			gross {
				amount
				currency
			}
		}
		variant {
			id
			name
			metadata {
				key
				value
			}
			product {
				id
				name
				description
				slug
				thumbnail {
					url
					alt
				}
				category {
					id
					name
				}
			}
			pricing {
				price {
					gross {
						amount
						currency
					}
				}
			}
			attributes {
				attribute {
					name
					slug
					inputType
				}
				values {
					name
					slug
					value
					id
					dateTime
				}
			}
		}
	}
}
