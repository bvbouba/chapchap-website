query ProductCollection(
  $before: String
  $after: String
  $first: Int = 4
  $filter: ProductFilterInput
  $sortBy: ProductOrder
  $channel: String!
  $departureDate: DateTimeRangeInput
) {
  products(
    first: $first
    channel: $channel
    after: $after
    before: $before
    filter: $filter
    sortBy: $sortBy
  ) {
    totalCount
    edges {
      cursor
      node {
        productVariants(
					last: 10
					where: { attributes: [{ slug: "departure-time", value: { dateTime: $departureDate } }] }
				) {
					edges {
						node {
							...ProductVariantListItem
						}
					}
				}
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}
