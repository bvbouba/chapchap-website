query ProductCollection(
  $before: String
  $after: String
  $first: Int = 4
  $filter: ProductFilterInput
  $sortBy: ProductOrder
  $channel: String!
  $departureDate: DateTimeRangeInput
) {
  products(
    first: $first
    channel: $channel
    after: $after
    before: $before
    filter: $filter
    sortBy: $sortBy
  ) {
    totalCount
    edges {
      cursor
      node {
        productVariants(
					last: 10
					where: { attributes: [{ slug: "departure-time", value: { dateTime: $departureDate } }] }
				) {
					edges {
						node {
							...ProductVariantListItem
						}
					}
				}
      }
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
  }
}

fragment ProductVariantListItem on ProductVariant {
	id
	name
	product {
		id
		name
		thumbnail(size: 1024, format: WEBP) {
		url
		alt
	}
		attributes {
			attribute {
				name
				slug
				inputType
			}
			values {
				name
				slug
				value
			}
		}
	}
	attributes {
		attribute {
			name
			slug
			inputType
		}
		values {
			name
			slug
			value
		}
	}
	pricing {
		price {
			gross {
				amount
				currency
			}
		}
	}
}
