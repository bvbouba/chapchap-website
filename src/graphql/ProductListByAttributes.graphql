query ProductListByAttributes(
	$first: Int = 10
	$channel: String!
	$departureCity: String!
	$arrivalCity: String!
	$departureDate: DateTimeRangeInput
) {
	products(
		first: $first
		channel: $channel
		filter: {
			attributes: [
				{ slug: "departure-city", values: [$departureCity] }
				{ slug: "arrival-city", values: [$arrivalCity] }
			]
		}
	) {
		edges {
			node {
				productVariants(
					last: 10
					where: { attributes: [{ slug: "departure-time", value: { dateTime: $departureDate } }] }
				) {
					edges {
						node {
							...ProductVariantListItem
						}
					}
				}
			}
		}
	}
}

fragment ProductVariantListItem on ProductVariant {
	id
	name
	product {
		id
		name
		media {
			url
			alt
		}
		attributes {
			attribute {
				name
				slug
				inputType
			}
			values {
				name
				slug
				value
			}
		}
	}
	attributes {
		attribute {
			name
			slug
			inputType
		}
		values {
			name
			slug
			value
		}
	}
	pricing {
		price {
			gross {
				amount
				currency
			}
		}
	}
}
